# ===== 服务器配置 =====
# Render 会自动注入 PORT 环境变量，本地开发默认 8080
server.port=${PORT:8080}
server.servlet.context-path=/

# ===== 数据库配置（从环境变量读取，适配 Railway/Render） =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/campus_lost_found?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

# ===== MyBatis 配置 =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.campus.lostfound.entity
mybatis.configuration.map-underscore-to-camel-case=true
# 生产环境关闭 SQL 日志，开发环境可打开
mybatis.configuration.log-impl=${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

# ===== 分页插件 =====
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true

# ===== 文件上传配置 =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== 自定义文件上传路径（云环境使用 /tmp） =====
file.upload-path=${UPLOAD_PATH:./uploads/}

# ===== 日志 =====
logging.level.com.campus.lostfound=${LOG_LEVEL:debug}
